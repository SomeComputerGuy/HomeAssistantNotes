blueprint:
  name: Ring Keypad Automations (Multi-Keypad)
  description: Automations to use one or more Ring Keypads with an Alarm Panel integration. Inbound events are accepted from every selected keypad; outbound indicator commands are sent via Z-Wave JS multicast. See https://github.com/ImSorryButWho/HomeAssistantNotes/blob/main/RingKeypadV2.md for more information.
  domain: automation
  input:
    keypads:
      name: Keypad Devices
      description: The device entries for the Ring keypads (all on the same Z-Wave network)
      selector:
        device:
          multiple: true
          filter:
            - manufacturer: Ring
              integration: zwave_js
    alarm:
      name: Alarm Control Panel entity
      description: The Alarm Control Panel to synchronize the keypads with
      selector:
        entity:
          domain: alarm_control_panel
          integration: alarmo
    selected_action_police:
      name: Selected Action Police
      description: Select the action for Police Button
      default: []
      selector:
        action:
    selected_action_fire:
      name: Selected Action Fire
      description: Select the action for Fire Button
      default: []
      selector:
        action:
    selected_action_medical:
      name: Selected Action Medical
      description: Select the action for Medical Button
      default: []
      selector:
        action:
variables:
  alarm: !input alarm
  keypads: !input keypads
  delay_total: "{{ state_attr(alarm, 'delay') | int(0) }}"
  delay_minutes: "{{ (delay_total // 60) | int }}"
  delay_seconds: "{{ (delay_total % 60) | int }}"
mode: parallel
max: 10
trace:
  stored_traces: 5
trigger:
  - platform: event
    event_type: "zwave_js_notification"
    event_data:
      command_class: 111
      event_type: 2
    id: code_entered
  - platform: event
    event_type: "zwave_js_notification"
    event_data:
      command_class: 111
      event_type: 3
    id: keypad_disarm
  - platform: event
    event_type: "zwave_js_notification"
    event_data:
      command_class: 111
      event_type: 5
    id: keypad_arm_away
  - platform: event
    event_type: "zwave_js_notification"
    event_data:
      command_class: 111
      event_type: 6
    id: keypad_arm_home
  - platform: event
    event_type: "zwave_js_notification"
    event_data:
      command_class: 111
      event_type: 16
    id: keypad_fire
  - platform: event
    event_type: "zwave_js_notification"
    event_data:
      command_class: 111
      event_type: 17
    id: keypad_police
  - platform: event
    event_type: "zwave_js_notification"
    event_data:
      command_class: 111
      event_type: 19
    id: keypad_medical
  - platform: event
    event_type: "alarmo_failed_to_arm"
    event_data:
      entity_id: !input alarm
      reason: "invalid_code"
    id: invalid_code
  - platform: event
    event_type: "alarmo_failed_to_arm"
    event_data:
      entity_id: !input alarm
      reason: "open_sensors"
    id: need_bypass
  - platform: state
    entity_id: !input alarm
    to: disarmed
    id: alarm_disarmed
  - platform: state
    entity_id: !input alarm
    to: arming
    id: alarm_arming
  - platform: state
    entity_id: !input alarm
    to: armed_away
    id: alarm_armed_away
  - platform: state
    entity_id: !input alarm
    to: armed_home
    id: alarm_armed_home
  - platform: state
    entity_id: !input alarm
    to: pending
    id: alarm_pending
  - platform: state
    entity_id: !input alarm
    to: triggered
    id: alarm_triggered
condition:
  - condition: not
    conditions:
      - condition: template
        value_template: "{{ ('from_state' in trigger) and (trigger.from_state.state == 'unknown') }}"
  # Z-Wave notifications only count if they came from one of the selected keypads
  - condition: template
    value_template: >
      {{ trigger.platform != 'event'
         or trigger.event.event_type != 'zwave_js_notification'
         or trigger.event.data.device_id in keypads }}
action:
  choose:
    - conditions:
        - condition: trigger
          id:
            - code_entered
            - keypad_disarm
      sequence:
        - service: alarmo.disarm
          data:
            entity_id: !input alarm
            code: >
              {% if trigger.event.data.event_data != none %}
                {{ trigger.event.data.event_data }}
              {% endif %}
    - conditions:
        - condition: and
          conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id: keypad_arm_away
                - condition: trigger
                  id: keypa